name: release

# Tag a version and this workflow packs the bundle DSH installs and publishes
# it as a release asset:
#
#   git tag v0.6.0
#   git push origin v0.6.0
#
# The resulting URL is
#   https://github.com/<owner>/dsh-speed-anchor/releases/download/v<version>/dsh-speed-anchor-<version>.tgz
#
# which DSH accepts directly in the plugin manager ("install from URL") or with
#   dsh plugin --profile <name> add <url>

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the client half parses
        run: node --check client.js
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          file="$(npm pack --ignore-scripts --silent | tail -n1)"
          if [ -z "$file" ] || [ ! -f "$file" ]; then
            file="$(ls -1t ./*.tgz | head -n1)"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Checksums
        run: sha256sum ./*.tgz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.pack.outputs.file }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}"; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$FILE" SHA256SUMS.txt --clobber
          else
            gh release create "$tag" "$FILE" SHA256SUMS.txt \
              --title "dsh-speed-anchor $VERSION" \
              --notes "Tarball asset for \`dsh plugin add\`: $FILE"
          fi
          # A release whose tag was re-created can come back as a draft; drafts
          # are invisible to unauthenticated downloads, so always publish.
          gh release edit "$tag" --draft=false
